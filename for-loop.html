<!-- for adalah salah satu kata kunci yang digunakan untuk melakukan perulangan
blok kode yang terdapat di dalam for akan selalu diulangi selama kondisi terpenuhi, 
dan akan berhenti jika kondisi sudah tidak terpenuhi, berbeda dengan if yang hanya dieksekusi sekali saja,
jika kondisi terpenuhi -->
<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>For Loop</title>
        <body>
            <script>
                /* init statement akan dieksekusi hanya sekali diawal sebelum perulangan
                - kondisi akan dilakukan pengecekan dalam setiap perulangan, jika true perulangan akan dilakukan, jika false perulangan akan berhenti
                - post statement akan dieksekusi setiap kali akhir perulangan
                - init statement, kondisi dan post statement tidak wajib diisi, jika kondisi tidak diisi berartii kondisi bernilai true
                - alur kerjanya: init statement -> kondisi -> blok perulangan -> post statement -> kondisi -> blok perulangan -> post statement -> dst..*/

                /* for (let i = 0; i < 10; i++){
                    console.info(i);
                } */

                /* for(;;){
                    alert("Hello World");
                } */
               let counter = 1;
               for (; counter <= 10;){
                document.writeln(`<p>Perulangan ke ${counter}</p>`)
                counter++;
               }
            </script>
        </body>
    </head>
</html>
