<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Operator Perbandingan</title>
    </head>
    <body>
        <script>
            let result = 5 == "5";
            document.writeln("<p>" + result + "</p>");

            result = 6 === 6;
            document.writeln("<p>" + result + "</p>");

            result = 5 < 19;
            document.writeln("<p>" + result + "</p>");
        </script>
    </body>
    </head>
</html>
