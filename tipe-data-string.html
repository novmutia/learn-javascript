<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tipe Data String</title>
    </head>
    <body>
        <script>
            document.writeln("saya sedang belajar  ");
            document.writeln("<br>");
            document.writeln('Hello World');
            document.writeln("<br>");
            document.writeln(`Hello World`);
            document.writeln("<br>");
            document.writeln("saya sedang belajar  " + "JavaScript " + "React");
            document.writeln("<br>");
// string escape character atau escape sequence (karakter khusus yang digunakan untuk menampilkan karakter tertentu dalam string)
            document.writeln("<textarea cols='18' rows='3'>");
            document.write("Nama Saya: \n");
            document.write("\\Novi\\Mutiara\\Sari\n");
            document.write("\"Teknik Informatika\"");
            document.writeln("</textarea>");
        </script>
    </body>
    <html></html>
