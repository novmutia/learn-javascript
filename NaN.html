<!--NaN Not a Number ketika data string yang dikonversi tidak valid-->
<DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaN Not a Number</title>
</head>
<body>
    <script>
        document.writeln(`${parseInt("Salah")}`);
        document.writeln('<br>');
        document.writeln(`${parseFloat("2.6Salah")}`);
        document.writeln('<br>');
        document.writeln(`${parseFloat("salah2.6")}`);
    </script>
</body>
</html>
