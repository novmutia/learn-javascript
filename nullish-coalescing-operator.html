<!--nullish coalescing operator 
nullish value = null dan undefined
nullish coalescing operator/ ?? adalah operator yang mirip dengan ternary operator,
yang membedakan adalah pada kondisi, jika bernilai null atau undefined, baru value defaultnya diambil-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nullish Coalescing Operator</title>
    </head>
    <body>
        <script>
            let parameter;
            let data = parameter;
            if (data === undefined || data == null){
                data = "Nilai Default";
            }

            document.writeln(`<p>${data}</p>`);

            data = parameter ?? "Nilai Default";

            document.writeln(`<p>${data}</p>`);
        </script>
    </body>
