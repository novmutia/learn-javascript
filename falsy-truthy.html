<!--falsy adalah nilai yang bernilai false
truthy adalah nilai yang bernilai true-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falsy Truthy</title>
</head>
<body>
    <script>
        let nilai;
        if (nilai){
            document.writeln("<p>Nilai bernilai true</p>");
        } else {
            document.writeln("<p>Nilai bernilai false</p>");
        }
    </script>
</body>
</html>
