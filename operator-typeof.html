<!--typeof merupakan operator yang bisa digunakan untuk melihat tipe data sebuah value atau variable
hasil dari operator typeof adalah string tipe datanya-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator typeof</title>
</head>
<body>
    <script>
        let data;

        const typeData = typeof data;
        document.writeln(`<p>${typeData}</p>`);
    </script>
</body>
</html>
