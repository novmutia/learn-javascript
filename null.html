<!--null merupakan representasi data kosong
varibale sudah ditambahkan value namun valuenya null sedangkan, undefined variablenya tidak ditambahkan value -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Null</title>
        <body>
            <script>
                let firstName = null;

                if(firstName === undefined){
                    alert("UNDEFINED");
                } else if(firstName === null){
                    alert("Hello Null");
                } else {
                    alert(`hello ${firstName}`);
                }
            </script>
        </body>    
    </head>
</html>
