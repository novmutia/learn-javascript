<!--switch adalah statement percabangan yang sama dengan if, namun lebih sederhana cara pembuatannya
kita hanya butuh kondisi sederhana di if statement, seperti hanya menggunakan perbandingan ==
kondisi switch statement hanya untuk perbandingan ==-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Statement</title>
</head>
<body>
    <script>
        const nilai = "C";
        switch (nilai){
            case "A":
                document.writeln("<p>Wow Anda Lulus dengan Sangat Baik</p>");
                break;
                case "B":
                document.writeln("<p>Wow Anda Lulus dengan Baik</p>");
                break;
                case "C":
                document.writeln("<p>Anda Lulus</p>");
                break;
                case "D":
                document.writeln("<p>Anda Tidak Lulus</p>");
                break;
                default:
                    document.writeln("<p>Nilai Tidak Valid</p>");
        }
    </script>
</body>
</html>
