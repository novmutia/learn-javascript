<!--optional chaining adalah operator yang digunakan untuk mengakses property dari object yang mungkin undefined-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optional Chaining</title>
    </head>
    <body>
        <script>
            const person = {
                address : {
                    country : "Norway"
                }
            };

            let country = person?.address?.country;
            //if(person.address !== undefined && person.address !== null){
        //  country = person.address.country;
          //  }
            

             document.writeln('---------------------');
             document.writeln(`<p>${country}</p>`);
             document.writeln('---------------------');
        </script>
    </body>
</html>
