<!--operator ternary adalah operator sederhana dari if statement
operator yang terdiri dari kondisi yang dievaluasi, jika menghasilkan true maka nilai pertama yang dieksekusi dan 
jika menghasilkan false maka nilai kedua yang dieksekusi/diambil-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Ternary</title>
</head>
<body>
    <script>
        const nilai = 70;
        const ucapan = nilai >= 75 ? "Selamat Anda Lolos" : "Silahkan Ulangi Lagi";
        document.writeln(`<p>${ucapan}</p>`);
    </script>
</body>
