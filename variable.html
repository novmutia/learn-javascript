<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tipe Data Variable</title>
</head>
<body>
    <script>
// javascript adalah dynamic language artinya bisa diubah

        /*var namaLengkap
        var namaDepan
        var namaBelakang
        var umur */

        const namaLengkap = 'Nadia Omara';
        let namaDepan = 'Nadia';
        let namaBelakang = 'Omara';
        let umur = 20;
        

        document.writeln(namaLengkap);
        document.writeln('<br>');
        document.writeln('nama depan = ' + namaDepan);
        document.writeln('<br>');
        document.writeln('namaLengkap = ' + namaLengkap);
        document.writeln('<br>');
        document.writeln('nama belakang = ' + namaBelakang);
        document.writeln('<br>');
        document.writeln('umur = ' + umur);
    </script>
</body>
</html>
