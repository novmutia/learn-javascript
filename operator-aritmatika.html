<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Operator Aritmatika</title>
</head>
<body>
    <script>
        let result = 1 + 4;
        document.writeln("<p>1 + 4 = " + result + "</p>");
        let originalResult = result;

        result-=3; //operator asignment augmented
        document.writeln("<p>" + originalResult + " - 3 = " + result + "</p>");
        originalResult = result;

        result*= 5;
        document.writeln("<p>" + originalResult + " * 5 = " + result + "</p>");
        originalResult = result;

        result/=5;
        document.writeln("<p>" + originalResult + " / 5 = " + result + "</p");
        originalResult = result;

        result%=4;
        document.writeln("<p>" + originalResult + " % 4 = " + result + "</p>");
        
    </script>
</body>
</html>
