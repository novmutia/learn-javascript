<!--undefined adalah kata kunci (tipe data) 
variable yang belum di definisikan/ditambahkan data/nilainya adalah undefined-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undefined</title>
</head>
<body>
    <script>
        let name;
        if (name === undefined) {
            alert("UNDEFINED");
        } else {
            alert("DEFINED");
        } 

        const names = ["Nini", "Nana"];
        if (names[3] === undefined){
            console.info('ARRAY UNDERFINED');
        } else{
            console.info("ARRAY DEFINED");
        }

        const person = {}
        if (person.name === undefined){
            console.info("object undefined");
        } else {
            console.info("object defined");
        }

    </script>
</body>
</html>
