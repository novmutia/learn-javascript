<!--logging merupakan mekanisme yang biasa dilakukan oleh programmer untuk menampikan 
informasi dari aplikasi yang sedang berjalan, tanpa mengganggu alur kerja aplikasi dan juga interaksi user -->
<!-- dalam js dapat menggunakan fitur console, cara menggunakan console dengan 
 memasukkan perintah kedalam kode js-->

 <!Doctype html>
 <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Console</title>
    </head>
    <body>
        <script>
            console.info('ini adalah informasi, bisa menggunakan .info atau .log');
            console.warn('ini adalah peringatan/warning');
            console.error('ini adalah error');
        </script>
    </body>
