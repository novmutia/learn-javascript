<!--backtick/(`) supprot multiline dengan langsung enter kalimat kebawah sehingga akan memunculkan multiline
tanpa harus menambahkan tanda plus-->

<DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiline</title>
    </head>
    <body>
        <script>
            const multiline = `Halo, saya adalah Nadia Omara
Saya sedang belajar JavaScript
Semoga saya bisa menjadi programmer handal`;

            document.writeln("<pre>")
            document.writeln(multiline);
            document.writeln("</pre>");

            console.info(multiline);
        </script>
    </body>
