<!--if expression/percabangan yaitu kita bisa mengeksekusi kode program tertentu ketika suatu kondisi terpenuhi.
blok if akan dieksekusi ketika bernilai true/terpenuhi, namun jika false maka
akan menggunakan Else expression-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if expression</title>
    </head>
    <body>
        <script>
            const nilaiUjian = 65;

            if (nilaiUjian > 70) {
                document.writeln(`<p>Nilai ${nilaiUjian} = Lolos</p>`);
            }
            else if (nilaiUjian == 70){
                document.writeln(`Nilai ${nilaiUjian} = Tidak Lolos`);
            } else if (nilaiUjian > 60){
                document.writeln(`Nilai ${nilaiUjian} = Lakukan Perbaikan`);
            } else {
                document.writeln(`Nilai ${nilaiUjian} = Silahkan Ulangi Lagi`);
            }
        </script>
    </body>
</html>
<!--jika membutuhkan beberapa kondisi makan gunakan else if dan kondisi terakhir gunakan else-->
