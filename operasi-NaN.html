<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konversi String ke Number</title>
</head>
<body>
    <script>
        const angkaPertama = Number("satu");
        const hasil = angkaPertama + 50;
        document.writeln(hasil);
        document.writeln(`<p>${isNaN(angkaPertama)}</p>`);
    </script>
</body>
</html>
