<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tipe Data Number</title></title>
</head>
<body>
    <script>
        document.writeln(1000);
        document.writeln('<br>');
        document.writeln(1.8);
        document.writeln('<br>');
        // notation number (sistem penulisan yang menggunakan simbol angka untuk mewakili nilai, nada, atau data tertentu)
        document.writeln(0b01001); // untuk menuliskan bilangan binary
        document.writeln('<br>');
        document.writeln(0xFF); // untuk menuliskan bilangan hexadecimal dengan diawal 0x
        document.writeln('<br>');
        document.writeln(0o123); // untuk menuliskan bilangan octal dengan diawali 0o
        </script>
        </body>
</html>
